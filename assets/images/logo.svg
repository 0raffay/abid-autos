  <circle cx="21" cy="20" r="11" fill="#FFFFFF"/>
  <circle cx="21" cy="20" r="7.5" fill="#000000"/>
  <circle cx="21" cy="20" r="2.6" fill="#FFFFFF"/>
  <g stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round">
